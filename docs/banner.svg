<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Master Builder — one mind holding the whole project, from raw land to disposition, anywhere on Earth">
  <title>Master Builder</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#16223A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C46A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8C46A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7FA6D9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- ============ drawing: half-section through a cathedral bay ============ -->
  <g stroke="#E8C46A" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ground line + hatch -->
    <path d="M60 258 H392" stroke-width="2" stroke-opacity="0.95"/>
    <g stroke-width="1" stroke-opacity="0.4">
      <path d="M64 258 l-10 12M88 258 l-10 12M112 258 l-10 12M136 258 l-10 12M160 258 l-10 12M184 258 l-10 12M208 258 l-10 12M232 258 l-10 12M256 258 l-10 12M280 258 l-10 12M304 258 l-10 12M328 258 l-10 12M352 258 l-10 12M376 258 l-10 12"/>
    </g>

    <!-- pointed (Gothic) arch -->
    <path d="M196 236 Q202 122 276 58 Q350 122 356 236" stroke-width="2.4" stroke-opacity="0.95"/>
    <!-- inner order of the arch -->
    <path d="M214 236 Q219 133 276 82 Q333 133 338 236" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- piers -->
    <path d="M180 236 V258 M196 236 V258 M356 236 V258 M372 236 V258" stroke-width="2" stroke-opacity="0.9"/>
    <path d="M180 236 H196 M356 236 H372" stroke-width="2" stroke-opacity="0.9"/>
    <!-- pier coursing -->
    <g stroke-width="0.8" stroke-opacity="0.3">
      <path d="M180 244 H196 M180 251 H196 M356 244 H372 M356 251 H372"/>
    </g>

    <!-- vault ribs springing from the crossing -->
    <path d="M196 236 Q276 196 356 236" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5 5"/>
    <path d="M276 58 V236" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="4 6"/>

    <!-- oculus -->
    <circle cx="276" cy="150" r="21" stroke-width="1.4" stroke-opacity="0.75"/>
    <circle cx="276" cy="150" r="11" stroke-width="0.9" stroke-opacity="0.4"/>

    <!-- flying buttress -->
    <path d="M372 214 Q404 206 416 236" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M416 236 V258 M400 236 H432 M400 258 H432" stroke-width="1.6" stroke-opacity="0.6"/>

    <!-- scaffold / lewis hint at the crown -->
    <path d="M262 58 H290" stroke-width="1.4" stroke-opacity="0.5"/>
  </g>

  <!-- dimension line, in drawing convention -->
  <g stroke="#7FA6D9" stroke-opacity="0.55" fill="none" stroke-width="1">
    <path d="M180 286 H372"/>
    <path d="M180 280 V292 M372 280 V292"/>
    <path d="M180 286 l9 -4 v8 z" fill="#7FA6D9" fill-opacity="0.55" stroke="none"/>
    <path d="M372 286 l-9 -4 v8 z" fill="#7FA6D9" fill-opacity="0.55" stroke="none"/>
  </g>
  <text x="276" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="11" fill="#7FA6D9" fill-opacity="0.75" letter-spacing="1.5">ONE BAY · SPAN VERIFIED ON SITE</text>

  <!-- ============ wordmark ============ -->
  <g>
    <text x="512" y="118" font-family="Georgia,'Iowan Old Style','Times New Roman',serif"
          font-size="62" font-weight="700" fill="#F5F0E6" letter-spacing="1">MASTER BUILDER</text>

    <path d="M514 140 H1180" stroke="url(#rule)" stroke-width="2"/>

    <text x="514" y="176" font-family="Georgia,'Iowan Old Style','Times New Roman',serif"
          font-size="20" font-style="italic" fill="#C9D6E8" fill-opacity="0.95">
      One mind holding the whole project — anywhere on Earth.
    </text>

    <text x="514" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="12.5" fill="#8FA8C8" letter-spacing="1.6">
      LAND → FEASIBILITY → DESIGN → CONSTRUCTION → HANDOVER → OPERATIONS → EXIT
    </text>

    <text x="514" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="12" fill="#E8C46A" fill-opacity="0.72" letter-spacing="1.2">
      MUNICIPAL CODE + CLIMATE = THE BOOK FOR THIS PLACE
    </text>

    <text x="514" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="11" fill="#7FA6D9" fill-opacity="0.6" letter-spacing="1.2">
      A CLAUDE SKILL · MIT · AEC + REAL ESTATE
    </text>
  </g>

  <!-- corner tick marks, like a plotted sheet -->
  <g stroke="#E8C46A" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M24 24 h20 M24 24 v20"/>
    <path d="M1256 24 h-20 M1256 24 v20"/>
    <path d="M24 296 h20 M24 296 v-20"/>
    <path d="M1256 296 h-20 M1256 296 v-20"/>
  </g>
</svg>
