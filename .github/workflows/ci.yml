name: CI

# The skill preaches a staged-validation gate and honest status (references/build-doctrine.md
# §5, §7, §10) — so the repo holds itself to it. This proves two things on every push:
#   1. dist/ is genuinely generated from source and has not drifted.
#   2. the MCP server still speaks the protocol.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Stdlib-only, so it must work on any supported Python without a lockfile.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Skill structure is intact
        run: python scripts/validate.py

      - name: Retrieval eval — every question routes to the right reference
        run: python scripts/eval_retrieval.py

      - name: Behaviour eval set is well-formed
        run: python scripts/eval_behavior.py --check

      - name: MCP server self-test
        run: python scripts/mcp_server.py --selftest

      - name: MCP server answers over real stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python scripts/mcp_server.py > /tmp/mcp_out.txt
          python - <<'PY'
          import json
          lines = open('/tmp/mcp_out.txt', encoding='utf-8').read().splitlines()
          assert len(lines) == 2, f"expected 2 responses (the notification gets none), got {len(lines)}"
          init, tools = (json.loads(l) for l in lines)
          assert init['result']['serverInfo']['name'] == 'master-builder'
          names = {t['name'] for t in tools['result']['tools']}
          # Assert the contract by name, not by count, so adding a tool doesn't break CI
          # while removing or renaming one still does.
          required = {
              'master_builder_get_protocol',
              'master_builder_list_references',
              'master_builder_read_reference',
              'master_builder_search',
              'master_builder_localize',
          }
          missing = required - names
          assert not missing, f"missing tools: {sorted(missing)}"
          assert all(t.get('inputSchema') for t in tools['result']['tools']), "a tool is missing its schema"
          print("stdio transport OK:", sorted(names))
          PY

      - name: dist/ and plugin/ are in sync with the source (rebuild must be a no-op)
        run: |
          python scripts/build.py
          if ! git diff --quiet -- dist/ plugin/; then
            echo "::error::Generated files are out of date. Run 'python scripts/build.py' and commit the result."
            git diff --stat -- dist/ plugin/
            git diff -- dist/ plugin/ | head -80
            exit 1
          fi
          echo "dist/ and plugin/ are in sync with SKILL.md + references/."
